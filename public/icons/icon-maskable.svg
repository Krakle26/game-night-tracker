<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Maskable: Android crops this to whatever shape the launcher likes. The sun
    is the only thing that must survive, so it sits well inside the safe circle
    (the middle 80%). The grid and horizon deliberately bleed past every edge —
    scaling them inward too would leave the artwork floating in a box.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D1566"/>
      <stop offset="0.55" stop-color="#1A0A38"/>
      <stop offset="1" stop-color="#0B0520"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC2E6"/>
      <stop offset="0.35" stop-color="#FF3CAC"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21D4FD" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#21D4FD" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#21D4FD" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="sunClip"><circle cx="256" cy="228" r="85"/></clipPath>
    <clipPath id="floorClip"><rect x="0" y="300" width="512" height="212"/></clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>

  <circle cx="256" cy="228" r="85" fill="url(#sun)"/>
  <g clip-path="url(#sunClip)">
    <rect x="165" y="250" width="182" height="7" fill="#1A0A38" opacity="0.92"/>
    <rect x="165" y="265" width="182" height="9" fill="#1A0A38" opacity="0.92"/>
    <rect x="165" y="282" width="182" height="12" fill="#1A0A38" opacity="0.92"/>
    <rect x="165" y="302" width="182" height="16" fill="#1A0A38" opacity="0.92"/>
  </g>

  <rect x="0" y="299" width="512" height="4" fill="#21D4FD" opacity="0.9"/>

  <g clip-path="url(#floorClip)" stroke="url(#floorFade)" fill="none" stroke-width="3">
    <path d="M256 301 L-200 512"/>
    <path d="M256 301 L-70 512"/>
    <path d="M256 301 L58 512"/>
    <path d="M256 301 L168 512"/>
    <path d="M256 301 L256 512"/>
    <path d="M256 301 L344 512"/>
    <path d="M256 301 L454 512"/>
    <path d="M256 301 L582 512"/>
    <path d="M256 301 L712 512"/>
  </g>
  <g clip-path="url(#floorClip)" stroke="#21D4FD" fill="none">
    <path d="M0 318 H512" stroke-width="2" opacity="0.35"/>
    <path d="M0 342 H512" stroke-width="2.5" opacity="0.5"/>
    <path d="M0 376 H512" stroke-width="3" opacity="0.65"/>
    <path d="M0 424 H512" stroke-width="3.5" opacity="0.8"/>
    <path d="M0 486 H512" stroke-width="4" opacity="0.9"/>
  </g>
</svg>
