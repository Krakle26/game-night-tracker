<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Game Night</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#12082B">
<!-- iOS ignores the manifest icons entirely and wants its own PNG. -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12082B;
    --bg-deep: #0B0520;
    --bg-lift: #2B0F4D;
    --paper: rgba(255,255,255,0.045);
    --paper-raised: rgba(255,255,255,0.07);
    --tape: #21D4FD;
    --tape-dark: #12A8CC;
    --spot: #FF3CAC;
    --violet: #7B2FF7;
    --ink: #F0E9FF;
    --ink-dim: #9C7BC7;
    --ink-dimmer: #6E5A94;
    --line: rgba(123,47,247,0.4);
    --line-soft: rgba(156,123,199,0.35);
    --grad: linear-gradient(135deg, #FF3CAC, #7B2FF7);

    --pc: #35C7C0;
    --ps5: #8B99FF;
    --xbox: #6BBF59;
    --switch: #E15554;
    --other: #E8933A;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      linear-gradient(180deg, var(--bg-lift) 0%, var(--bg) 38%, var(--bg-deep) 100%)
      fixed;
    color:var(--ink);
    font-family:'Rajdhani', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:104px;
  }
  /* The grid horizon, pinned behind everything. */
  body::after{
    content:'';
    position:fixed;
    left:0; right:0; bottom:0;
    height:240px;
    background:
      repeating-linear-gradient(90deg, rgba(255,60,172,0.22) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(180deg, rgba(33,212,253,0.18) 0 1px, transparent 1px 26px);
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 70%);
    mask-image:linear-gradient(180deg, transparent 0%, #000 70%);
    pointer-events:none;
    z-index:0;
  }
  .display{ font-family:'Orbitron', sans-serif; font-weight:800; letter-spacing:0.06em; }
  .mono{ font-family:'Rajdhani', sans-serif; font-weight:600; }

  /* ---------- Masthead ---------- */
  .masthead{
    position:relative;
    z-index:1;
    margin:26px 20px 22px;
    padding:0;
    text-align:left;
  }
  .masthead h1{
    margin:0;
    font-size:29px;
    line-height:1.1;
    background:linear-gradient(180deg, #FFFFFF 20%, var(--spot) 95%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,60,172,0.45));
  }
  .masthead .sub{
    margin:5px 0 0;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .masthead .pass{
    margin-top:12px;
    font-size:13px;
    font-weight:600;
    color:var(--ink-dimmer);
  }
  .masthead .pass strong{ color:var(--ink) !important; font-weight:700; }
  .masthead .pass button{
    background:none; border:none; color:var(--tape);
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:13px; text-decoration:underline;
    cursor:pointer; padding:0;
  }

  /* ---------- Search ---------- */
  .search-wrap{ position:relative; z-index:1; margin:0 20px 18px; }
  .search-wrap input{
    width:100%;
    background:var(--paper);
    border:1px solid rgba(33,212,253,0.35);
    border-radius:999px;
    padding:13px 18px;
    color:var(--ink);
    font-family:'Rajdhani', sans-serif;
    font-weight:500;
    font-size:16px;
  }
  .search-wrap input::placeholder{ color:var(--ink-dimmer); }
  .search-wrap input:focus{ outline:none; border-color:var(--tape); box-shadow:0 0 18px rgba(33,212,253,0.3); }

  /* ---------- Platform filter ---------- */
  /* A horizontally-scrolling row rather than wrapping, so it never pushes the
     tabs down — five chips plus "All" is already tight at phone width. */
  .platform-filter{
    position:relative; z-index:1;
    display:flex; gap:8px;
    margin:0 20px 18px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .platform-filter::-webkit-scrollbar{ display:none; }
  .pf-chip{
    flex:0 0 auto;
    background:none;
    border:1px solid var(--line-soft);
    border-radius:999px;
    color:var(--ink-dim);
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:0.08em;
    font-size:12px;
    min-height:44px;
    padding:0 16px;
    cursor:pointer;
    display:flex; align-items:center;
  }
  /* "All" reads as the reset/default, so it borrows the tabs' actionable
     gradient rather than a platform colour. Every other chip tints from the
     same --tagc a game's own tag uses, so the colour keeps meaning the same
     thing everywhere it shows up. */
  .pf-chip[data-platform="All"].active{
    color:#FFFFFF;
    border-color:transparent;
    background:var(--grad);
    box-shadow:0 0 16px rgba(255,60,172,0.5);
  }
  .pf-chip:not([data-platform="All"]).active{
    color:var(--tagc);
    border-color:var(--tagc);
    background:color-mix(in srgb, var(--tagc) 20%, transparent);
    box-shadow:0 0 14px color-mix(in srgb, var(--tagc) 40%, transparent);
  }
  .pf-chip:focus-visible{ outline:2px solid var(--tape); outline-offset:2px; }

  /* ---------- Tabs ---------- */
  .tabs{
    position:relative;
    z-index:1;
    display:flex;
    gap:8px;
    margin:0 20px 18px;
  }
  .tab{
    flex:1;
    background:none;
    border:1px solid var(--line-soft);
    border-radius:999px;
    color:var(--ink-dim);
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    letter-spacing:0.1em;
    font-size:12px;
    padding:11px 4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .tab .count{ font-size:11px; font-weight:600; opacity:0.75; }
  .tab.active{
    color:#FFFFFF;
    border-color:transparent;
    background:var(--grad);
    box-shadow:0 0 16px rgba(255,60,172,0.5);
  }
  .tab:focus-visible{ outline:2px solid var(--tape); outline-offset:2px; }

  /* ---------- List ---------- */
  .list{ position:relative; z-index:1; margin:0 20px; display:flex; flex-direction:column; gap:12px; }
  .empty{
    text-align:center;
    color:var(--ink-dim);
    font-size:17px;
    font-weight:600;
    line-height:1.6;
    padding:34px 20px;
    border:1px dashed var(--line-soft);
    border-radius:18px;
  }
  .empty svg{ opacity:0.85; margin-bottom:12px; }
  .status-msg{ position:relative; z-index:1; text-align:center; color:var(--ink-dim); font-size:15px; font-weight:600; padding:24px; }

  .stub{
    position:relative;
    display:flex;
    align-items:center;
    gap:13px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
  }

  /* On stage: the game actually being played, and it should look like it. */
  .stub.now{
    flex-wrap:wrap;
    margin-top:10px;
    padding:18px 16px 16px;
    border-color:rgba(255,60,172,0.7);
    border-radius:18px;
    background:linear-gradient(135deg, rgba(255,60,172,0.22), rgba(33,212,253,0.14));
    box-shadow:0 0 30px rgba(255,60,172,0.35);
  }
  .stub.now::before{
    content:'NOW PLAYING';
    position:absolute;
    top:0; left:20px;
    transform:translateY(-50%);
    background:var(--grad);
    color:#FFFFFF;
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:9px;
    letter-spacing:0.16em;
    padding:5px 11px;
    border-radius:999px;
    box-shadow:0 0 16px rgba(255,60,172,0.6);
  }

  .cover{
    width:56px; min-width:56px; height:56px;
    border-radius:10px;
    background:var(--grad);
    display:flex; align-items:center; justify-content:center;
    color:var(--bg);
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:20px;
    overflow:hidden;
  }
  .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .stub.now .cover{ width:76px; min-width:76px; height:76px; border-radius:14px; font-size:27px; box-shadow:0 0 22px rgba(255,60,172,0.45); }

  .stub-body{
    flex:1;
    min-width:0;
    padding:0;
    display:flex; flex-direction:column; justify-content:center; gap:5px;
  }
  .stub-title{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:17px;
    line-height:1.2;
    color:var(--ink);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
  }
  .stub.now .stub-title{
    font-size:23px;
    /* The card has its own row for buttons, so opt out of the two-line clamp. */
    display:block;
    -webkit-line-clamp:none;
    overflow:visible;
    line-height:1.15;
  }
  .stub.now .stub-actions{
    flex:1 0 100%;
    justify-content:flex-end;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.12);
  }
  .stub-meta{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-family:'Rajdhani', sans-serif;
    font-weight:500;
    font-size:13px;
    color:var(--ink-dimmer);
    letter-spacing:0;
  }
  .tag{
    display:inline-block;
    padding:3px 9px;
    border-radius:999px;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.1em;
    color:var(--tagc, var(--other));
    background:color-mix(in srgb, var(--tagc, var(--other)) 22%, transparent);
  }
  .note{
    font-family:'Rajdhani', sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--ink-dim);
    font-style:italic;
    letter-spacing:0;
  }

  /* The ticket-stub perforation has no place in this identity. */
  .perf{ display:none; }

  .stub-actions{
    display:flex; align-items:center; justify-content:center;
    gap:8px;
    padding:0;
    flex-shrink:0;
  }
  .act-btn{
    background:none;
    border:1px solid var(--line-soft);
    color:var(--ink-dim);
    width:44px; height:44px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  .act-btn:hover{ border-color:var(--tape); color:var(--tape); }
  .act-btn.advance{ border-color:rgba(33,212,253,0.6); color:var(--tape); }
  .act-btn:focus-visible{ outline:2px solid var(--tape); outline-offset:2px; }
  .act-btn.danger:hover{ border-color:var(--spot); color:var(--spot); }
  .stub.now .act-btn.danger{ border-color:rgba(255,60,172,0.5); color:var(--spot); }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    right:20px; bottom:26px;
    width:60px; height:60px;
    border-radius:50%;
    background:var(--grad);
    color:#FFFFFF;
    border:none;
    font-family:'Orbitron', sans-serif;
    font-size:26px;
    font-weight:800;
    box-shadow:0 0 26px rgba(255,60,172,0.7);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .fab:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(11,5,32,0.86);
    display:flex; align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  @media (min-width:560px){ .overlay{ align-items:center; } }
  .modal{
    background:linear-gradient(180deg, var(--bg-lift) 0%, #16092F 45%, #0F0726 100%);
    border:1px solid rgba(255,60,172,0.6);
    border-bottom:none;
    width:100%;
    max-width:480px;
    max-height:85vh;
    border-radius:26px 26px 0 0;
    padding:22px 20px 26px;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:14px;
    box-shadow:0 -8px 40px rgba(255,60,172,0.28);
  }
  @media (min-width:560px){ .modal{ border-radius:22px; border-bottom:1px solid rgba(255,60,172,0.6); } }
  .modal h2{
    margin:0;
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:0.06em;
    background:linear-gradient(180deg, #FFFFFF 20%, var(--spot) 95%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .modal .close, .modal .edit-btn{
    position:absolute; top:14px;
    background:none;
    border:1px solid var(--line-soft);
    border-radius:50%;
    width:44px; height:44px;
    color:var(--ink-dim);
    font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .modal .close{ right:18px; }
  .modal .edit-btn{ right:70px; }
  .field label{
    display:block;
    font-family:'Rajdhani', sans-serif;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.16em;
    color:var(--ink-dim);
    margin-bottom:7px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background:var(--paper-raised);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:14px 16px;
    color:var(--ink);
    font-family:'Rajdhani', sans-serif;
    font-weight:500;
    font-size:16px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--tape); box-shadow:0 0 18px rgba(33,212,253,0.28);
  }
  .btn{
    background:var(--grad);
    color:#FFFFFF;
    border:none;
    border-radius:999px;
    padding:17px 16px;
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.1em;
    cursor:pointer;
    box-shadow:0 0 24px rgba(255,60,172,0.55);
  }
  .btn.secondary{
    background:none;
    border:1px solid var(--line-soft);
    color:var(--ink);
    box-shadow:none;
  }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .result-row{
    display:flex; align-items:center; gap:12px;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    border:1px solid rgba(123,47,247,0.3);
    background:rgba(255,255,255,0.04);
  }
  .result-row:hover{ background:var(--paper-raised); border-color:var(--tape); }
  .result-row .cover{ width:48px; min-width:48px; height:48px; border-radius:9px; font-size:17px; }
  .result-row .rtitle{ font-size:16px; font-weight:700; }
  .result-row .rmeta{ font-size:13px; font-weight:500; color:var(--ink-dimmer); font-family:'Rajdhani', sans-serif; }

  .banner{
    font-size:14px;
    font-weight:600;
    padding:13px 15px;
    border-radius:14px;
    background:rgba(33,212,253,0.12);
    border:1px solid rgba(33,212,253,0.5);
    color:var(--tape);
  }
  .banner.error{
    background:rgba(255,60,172,0.14);
    border-color:rgba(255,60,172,0.7);
    color:#FFA8D6;
  }

  /* ---------- Game detail ---------- */
  .stub{ cursor:pointer; }
  .stub:hover{ border-color:rgba(33,212,253,0.55); }
  .stub:active{ background:var(--paper-raised); }

  .detail-banner{
    width:calc(100% + 40px);
    margin:-22px -20px 0;
    aspect-ratio:16/9;
    background:var(--grad);
    overflow:hidden;
    position:relative;
  }
  .detail-banner img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail-banner::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(43,15,77,0) 45%, #2B0F4D 100%);
  }
  .detail-head h2{ margin:0; }
  .detail-year{ font-size:15px; font-weight:600; color:var(--ink-dimmer); margin-top:2px; }

  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    display:flex; align-items:center; gap:5px;
    padding:5px 11px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--line-soft);
    color:var(--ink-dim);
  }
  .chip.strong{ color:var(--tape); border-color:rgba(33,212,253,0.5); background:rgba(33,212,253,0.12); }
  .chip.on{ color:#FFFFFF; border-color:transparent; background:var(--grad); }

  .detail-label{
    font-size:12px; font-weight:700; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--ink-dimmer);
  }
  .detail-desc{
    font-size:15px; font-weight:500; line-height:1.65; color:var(--ink-dim);
    white-space:pre-line;
  }
  .detail-actions{ display:flex; gap:9px; }
  .detail-actions .btn{ flex:1; padding:15px 8px; font-size:12px; }
  #noteInput{
    width:100%;
    background:var(--paper-raised);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:14px 16px;
    color:var(--ink);
    font-family:'Rajdhani', sans-serif;
    font-weight:500;
    font-size:16px;
    resize:vertical;
  }
  #noteInput::placeholder{ color:var(--ink-dimmer); }
  #noteInput:focus{ outline:none; border-color:var(--tape); box-shadow:0 0 18px rgba(33,212,253,0.28); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="masthead">
  <h1 class="display">GAME NIGHT</h1>
  <p class="sub">the weekly set list</p>
  <p class="pass" id="passLine"></p>
</div>

<div class="search-wrap">
  <input id="searchInput" type="text" placeholder="Search the set list…" autocomplete="off">
</div>

<div class="platform-filter" role="tablist" aria-label="Filter by platform">
  <button class="pf-chip active" data-platform="All">ALL</button>
  <button class="pf-chip" data-platform="PC" style="--tagc:var(--pc)">PC</button>
  <button class="pf-chip" data-platform="PS5" style="--tagc:var(--ps5)">PS5</button>
  <button class="pf-chip" data-platform="Xbox" style="--tagc:var(--xbox)">XBOX</button>
  <button class="pf-chip" data-platform="Switch" style="--tagc:var(--switch)">SWITCH</button>
  <button class="pf-chip" data-platform="Other" style="--tagc:var(--other)">OTHER</button>
</div>

<div class="tabs" role="tablist">
  <button class="tab" data-status="up_next" role="tab">ON DECK<span class="count" id="count-up_next">0</span></button>
  <button class="tab" data-status="playing" role="tab">ON STAGE<span class="count" id="count-playing">0</span></button>
  <button class="tab" data-status="played" role="tab">PLAYED IT<span class="count" id="count-played">0</span></button>
</div>

<div class="list" id="list"></div>

<button class="fab" id="addBtn" aria-label="Add a game">+</button>

<div id="modalRoot"></div>

<script>
(function(){

  // ===== Config =====
  // Get a free key at https://rawg.io/apidocs and paste it below.
  // RAWG's API allows direct browser requests, so no proxy/Worker is needed.
  const RAWG_API_KEY = "06ebc605c8c54b368be09f565c726f4e";
  const RAWG_PLATFORM_MAP = {
    'PC': 'PC',
    'PlayStation 5': 'PS5',
    'PlayStation 4': 'PS5',
    'Xbox Series S/X': 'Xbox',
    'Xbox One': 'Xbox',
    'Nintendo Switch': 'Switch',
  };
  function mapRawgPlatforms(platformsField){
    if (!platformsField || platformsField.length === 0) return ['Other'];
    const names = new Set();
    platformsField.forEach(p => {
      const name = p.platform && p.platform.name;
      names.add(RAWG_PLATFORM_MAP[name] || 'Other');
    });
    return names.size > 0 ? Array.from(names) : ['Other'];
  }

  const PLATFORM_COLORS = { PC:'var(--pc)', PS5:'var(--ps5)', Xbox:'var(--xbox)', Switch:'var(--switch)', Other:'var(--other)' };
  const PLATFORMS = Object.keys(PLATFORM_COLORS);
  const STATUS_LABEL = { up_next:'On Deck', playing:'On Stage', played:'Played It' };
  const STATUS_ORDER = ['up_next','playing','played'];

  let state = {
    myName: null,
    games: [],
    activeTab: 'up_next',
    query: '',
    platformFilter: 'All',
    loading: true,
    loadError: null,
    lastSynced: null,
    needsPass: false,
  };

  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

  function uid(){
    return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function timeAgo(ts){
    const diff = Date.now() - ts;
    const mins = Math.round(diff/60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.round(mins/60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.round(hrs/24);
    return days + 'd ago';
  }

  /**
   * On Deck is the one list where a game sits actually matters — it's
   * the answer to "what do we play next". The other two lists are read as
   * history, not a queue, so they stay ordered by recency the way they
   * always have (the server already keeps the whole catalog sorted by
   * updatedAt, which the client renders in as-is).
   *
   * Games added before this feature existed have no `order` field. Falling
   * back to -(updatedAt||addedAt) reproduces exactly the ordering they
   * already had — newest touched first — so nothing visibly reshuffles
   * until someone actually taps Move up/down on it.
   */
  function effectiveOrder(game){
    return game.order != null ? game.order : -(game.updatedAt || game.addedAt || 0);
  }
  function upNextOrdered(){
    return state.games
      .filter(g => g.status === 'up_next')
      .sort((a, b) => effectiveOrder(a) - effectiveOrder(b));
  }

  // ===== Storage =====
  // Two different things with two different homes: the name is per-device and
  // never leaves the phone, the set list is shared and lives in KV behind
  // /api/games. localStorage works here because this is a real hosted page.
  const NAME_KEY = 'game-night:my-name';
  const TOKEN_KEY = 'game-night:pass-code';

  function loadToken(){
    try{ return window.localStorage.getItem(TOKEN_KEY); }
    catch(e){ return null; }
  }

  function saveToken(code){
    try{ window.localStorage.setItem(TOKEN_KEY, code); }
    catch(e){ console.error('Could not save the pass code', e); }
  }

  function clearToken(){
    try{ window.localStorage.removeItem(TOKEN_KEY); }
    catch(e){ /* nothing we can do */ }
  }

  /**
   * Every call to /api goes through here so the pass code is attached in one
   * place. A 401 means the code was rotated or mistyped — drop it and send
   * them back to the gate rather than leaving them staring at an empty list.
   */
  async function apiFetch(url, options){
    const opts = Object.assign({}, options);
    opts.headers = Object.assign({}, opts.headers, { 'X-App-Token': loadToken() || '' });
    const r = await fetch(url, opts);
    if (r.status === 401){
      clearToken();
      state.needsPass = true;
      state.loading = false;
      state.loadError = null;
      render();
      openPassModal('That pass code was rejected. Check it and try again.');
      throw new Error('Unauthorized');
    }
    return r;
  }

  function loadName(){
    try{
      const saved = window.localStorage.getItem(NAME_KEY);
      if (saved) state.myName = saved;
    }catch(e){ /* blocked storage — they will just be asked for a name again */ }
  }

  function saveName(name){
    state.myName = name;
    try{
      window.localStorage.setItem(NAME_KEY, name);
    }catch(e){ console.error('Could not save name', e); }
  }

  async function fetchGames(){
    const r = await apiFetch('/api/games', { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('GET /api/games returned ' + r.status);
    const body = await r.json();
    return Array.isArray(body.games) ? body.games : [];
  }

  async function loadGames(){
    state.loading = true;
    state.loadError = null;
    render();
    try{
      state.games = await fetchGames();
      state.lastSynced = Date.now();
    }catch(e){
      state.loadError = 'Could not load the set list. Pull to refresh or try again.';
    }
    state.loading = false;
    render();
  }

  let isPolling = false;
  async function pollGames(){
    if (isPolling || document.hidden) return;
    isPolling = true;
    try{
      state.games = await fetchGames();
      state.lastSynced = Date.now();
      state.loadError = null;
      render();
    }catch(e){
      // Silent failure — the next successful poll or manual refresh will recover.
    }
    isPolling = false;
  }

  let pollTimer = null;
  function startPolling(){
    // Re-entered whenever a rejected pass code is retried; without this each
    // attempt would stack another interval and multiply the poll rate.
    if (pollTimer) return;
    pollTimer = setInterval(pollGames, 20000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) pollGames();
    });
  }

  async function saveGame(game){
    const r = await apiFetch('/api/games', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(game),
    });
    if (!r.ok){
      console.error('POST /api/games returned ' + r.status);
      throw new Error('Save failed');
    }
    // The write hands back the merged list, so saving doubles as a sync —
    // someone else's addition lands without waiting for the next poll.
    const body = await r.json();
    if (Array.isArray(body.games)){
      state.games = body.games;
      state.lastSynced = Date.now();
      render();
    }
  }

  async function deleteGame(id){
    const r = await apiFetch('/api/games?id=' + encodeURIComponent(id), { method: 'DELETE' });
    if (!r.ok){
      console.error('DELETE /api/games returned ' + r.status);
      throw new Error('Delete failed');
    }
    const body = await r.json();
    if (Array.isArray(body.games)){
      state.games = body.games;
      state.lastSynced = Date.now();
      render();
    }
  }

  const detailCache = new Map();

  async function fetchGameDetail(sourceId){
    if (detailCache.has(sourceId)) return detailCache.get(sourceId);
    const url = 'https://api.rawg.io/api/games/' + encodeURIComponent(sourceId)
      + '?key=' + encodeURIComponent(RAWG_API_KEY);
    const r = await fetch(url);
    if (!r.ok) throw new Error('RAWG detail returned ' + r.status);
    const j = await r.json();
    const detail = {
      platforms: (j.platforms || []).map(x => x.platform && x.platform.name).filter(Boolean),
      playtime: j.playtime || null,
      metacritic: j.metacritic || null,
      genres: (j.genres || []).map(x => x.name),
      description: (j.description_raw || '').trim(),
    };
    detailCache.set(sourceId, detail);
    return detail;
  }

  // ===== Actions =====
  async function addGame({ title, platform, coverUrl, sourceId, year }){
    // Lands at the front of the queue, same place a new game has always
    // appeared — one lower than the current lowest so it sorts ahead of
    // everything already there, however that existing order came to be.
    const upNext = upNextOrdered();
    const order = (upNext.length ? effectiveOrder(upNext[0]) : 0) - 1000;
    const game = {
      id: uid(),
      title, platform, coverUrl: coverUrl || null, sourceId: sourceId || null, year: year || null,
      status: 'up_next',
      order,
      note: '',
      addedBy: state.myName,
      addedAt: Date.now(),
      updatedAt: Date.now(),
      updatedBy: state.myName,
    };
    state.games.unshift(game);
    render();
    try{
      await saveGame(game);
    }catch(e){
      state.loadError = 'Added locally, but saving to the shared list failed — try again.';
      render();
    }
  }

  async function advanceStatus(game){
    const idx = STATUS_ORDER.indexOf(game.status);
    if (idx === STATUS_ORDER.length - 1) return;
    game.status = STATUS_ORDER[idx+1];
    game.updatedAt = Date.now();
    game.updatedBy = state.myName;
    render();
    try{ await saveGame(game); }
    catch(e){ state.loadError = 'Move failed to save — try again.'; render(); }
  }

  async function revertStatus(game){
    const idx = STATUS_ORDER.indexOf(game.status);
    if (idx === 0) return;
    game.status = STATUS_ORDER[idx-1];
    game.updatedAt = Date.now();
    game.updatedBy = state.myName;
    render();
    try{ await saveGame(game); }
    catch(e){ state.loadError = 'Move failed to save — try again.'; render(); }
  }

  /**
   * Swaps this game's queue position with its neighbor. Deliberately does not
   * touch updatedAt/updatedBy — a reorder isn't a content change, and stamping
   * one would make "3m ago" lie about when the game itself was last touched,
   * plus reshuffle its position in the Played It / On Stage lists for no
   * reason (those stay sorted by updatedAt).
   *
   * The neighbor is re-fetched from state.games between the two saves rather
   * than reusing the reference captured up front, so the second save can't
   * clobber a field someone else changed on it while the first save was in
   * flight — the same merge-on-write contract every other action here relies on.
   */
  async function moveInQueue(game, direction){
    const list = upNextOrdered();
    const idx = list.findIndex(g => g.id === game.id);
    const swapIdx = idx + direction;
    if (idx === -1 || swapIdx < 0 || swapIdx >= list.length) return;

    const neighborId = list[swapIdx].id;
    const mine = effectiveOrder(game);
    const theirs = effectiveOrder(list[swapIdx]);
    game.order = theirs;
    list[swapIdx].order = mine;
    render();
    try{
      await saveGame(game);
      const neighbor = state.games.find(g => g.id === neighborId);
      if (neighbor){
        neighbor.order = mine;
        await saveGame(neighbor);
      }
    }catch(e){
      state.loadError = 'Reordering failed to save — try again.';
      render();
    }
  }

  async function removeGame(game){
    const previous = state.games;
    state.games = state.games.filter(g => g.id !== game.id);
    render();
    try{
      await deleteGame(game.id);
    }catch(e){
      // Put it back rather than leave the list lying about what is shared.
      state.games = previous;
      state.loadError = 'Could not delete that — try again.';
      render();
    }
  }

  async function saveNote(game, note){
    const updated = Object.assign({}, game, {
      note: note,
      updatedAt: Date.now(),
      updatedBy: state.myName,
    });
    await saveGame(updated);
  }

  // ===== Rendering =====
  function renderPassLine(){
    const el = $('#passLine');
    const syncedBit = state.lastSynced ? ` · <span style="color:var(--ink-dim)">synced ${timeAgo(state.lastSynced)}</span>` : '';
    if (state.myName){
      el.innerHTML = `Playing as <strong style="color:var(--ink)">${escapeHtml(state.myName)}</strong> · <button id="changeNameBtn">change</button>${syncedBit}`;
      $('#changeNameBtn').onclick = openNameModal;
    } else {
      el.innerHTML = syncedBit ? syncedBit.replace(/^ · /, '') : '';
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function coverEl(game){
    if (game.coverUrl){
      return `<div class="cover"><img src="${game.coverUrl}" alt=""></div>`;
    }
    const letter = (game.title || '?').trim()[0]?.toUpperCase() || '?';
    return `<div class="cover">${letter}</div>`;
  }

  function tagEl(platform){
    const color = PLATFORM_COLORS[platform] || PLATFORM_COLORS.Other;
    return `<span class="tag" style="--tagc:${color}">${platform}</span>`;
  }

  function stubEl(game, showStatus){
    const isNow = game.status === 'playing';
    const canAdvance = game.status !== 'played';
    const canRevert = game.status !== 'up_next';
    const meta = [
      tagEl(game.platform),
      `by ${escapeHtml(game.addedBy || 'someone')}`,
      timeAgo(game.updatedAt || game.addedAt),
    ];
    // Only relevant once search mixes rows from all three lists together —
    // inside a single tab the status is already implied by being there.
    if (showStatus) meta.splice(1, 0, STATUS_LABEL[game.status]);
    return `
      <div class="stub ${isNow?'now':''}" data-id="${game.id}">
        ${coverEl(game)}
        <div class="stub-body">
          <div class="stub-title">${escapeHtml(game.title)}${game.year ? ' <span style="color:var(--ink-dimmer);font-size:15px;font-weight:500">('+game.year+')</span>' : ''}</div>
          <div class="stub-meta">${meta.map(m=>`<span>${m}</span>`).join('<span>·</span>')}</div>
          ${game.note ? `<div class="note">"${escapeHtml(game.note)}"</div>` : ''}
        </div>
        <div class="perf"></div>
        <div class="stub-actions">
          ${canAdvance ? `<button class="act-btn advance" data-action="advance" data-id="${game.id}" aria-label="Move to next stage" title="Move forward">›</button>` : ''}
          ${canRevert ? `<button class="act-btn" data-action="revert" data-id="${game.id}" aria-label="Move back" title="Move back">‹</button>` : ''}
        </div>
      </div>
    `;
  }

  function render(){
    renderPassLine();

    $$('.tab').forEach(tab => {
      const isActive = tab.dataset.status === state.activeTab;
      tab.classList.toggle('active', isActive);
    });
    $$('.pf-chip').forEach(chip => {
      chip.classList.toggle('active', chip.dataset.platform === state.platformFilter);
    });
    STATUS_ORDER.forEach(s => {
      const n = state.games.filter(g => g.status === s).length;
      const el = $('#count-'+s);
      if (el) el.textContent = n;
    });

    const listEl = $('#list');
    if (state.loading){
      listEl.innerHTML = '<div class="status-msg">Loading the set list…</div>';
      return;
    }
    // A query searches every list, not just the open tab — otherwise finding
    // something already marked Played It means guessing which tab to try
    // first. The active tab still governs everything once the box is empty.
    const searching = state.query.trim() !== '';

    let banners = '';
    if (state.loadError) banners += `<div class="banner error" style="margin-bottom:12px">${state.loadError}</div>`;
    if (searching) banners += `<div class="banner" style="margin-bottom:12px">Searching every list for "${escapeHtml(state.query.trim())}" — tabs are ignored while you're searching.</div>`;
    listEl.innerHTML = banners;

    let games = searching ? state.games.slice()
      : state.activeTab === 'up_next' ? upNextOrdered()
      : state.games.filter(g => g.status === state.activeTab);
    if (state.platformFilter !== 'All'){
      games = games.filter(g => g.platform === state.platformFilter);
    }
    if (searching){
      const q = state.query.trim().toLowerCase();
      games = games.filter(g => g.title.toLowerCase().includes(q));
    }

    if (games.length === 0){
      const platformOn = state.platformFilter !== 'All' ? ' on ' + state.platformFilter : '';
      const emptyMsg = searching
        ? 'No games match your search' + platformOn + '.'
        : platformOn
          ? 'No games in this list' + platformOn + '.'
          : (state.activeTab === 'up_next' ? 'Nothing queued yet. Add a game to get the night started.'
            : state.activeTab === 'playing' ? 'Nothing on stage right now.'
            : 'Nothing played yet — the list starts here.');
      const pad = '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="1.4" aria-hidden="true">'
        + '<rect x="2" y="7" width="20" height="12" rx="4"/><path d="M7 11v4"/><path d="M5 13h4"/>'
        + '<circle cx="16" cy="12" r="1"/><circle cx="18.5" cy="14.5" r="1"/></svg>';
      listEl.insertAdjacentHTML('beforeend', `<div class="empty">${pad}<div>${emptyMsg}</div></div>`);
    } else {
      // stubEl(g, searching), not the bare function — Array.map also passes
      // the index, which would make every even-indexed row think it was in
      // search mode too.
      listEl.insertAdjacentHTML('beforeend', games.map(g => stubEl(g, searching)).join(''));
    }

    $$('.stub', listEl).forEach(row => {
      row.onclick = (e) => {
        // The action buttons own their taps; only the rest of the row opens.
        if (e.target.closest('.act-btn')) return;
        const g = state.games.find(x => x.id === row.dataset.id);
        if (g) openGameModal(g);
      };
    });
    $$('[data-action="advance"]', listEl).forEach(btn => {
      btn.onclick = () => {
        const g = state.games.find(x => x.id === btn.dataset.id);
        if (g) advanceStatus(g);
      };
    });
    $$('[data-action="revert"]', listEl).forEach(btn => {
      btn.onclick = () => {
        const g = state.games.find(x => x.id === btn.dataset.id);
        if (g) revertStatus(g);
      };
    });
  }

  // ===== Name modal =====
  function openGameModal(game){
    const root = $('#modalRoot');
    const cover = game.coverUrl
      ? `<div class="detail-banner"><img src="${game.coverUrl}" alt=""></div>`
      : '';
    const canAdvance = game.status !== 'played';
    const canRevert = game.status !== 'up_next';

    // Queue position only means anything on On Deck — On Stage and Played It
    // are read as history, not something to reorder. Buttons live here, not
    // on the row, for the same reason Delete does: a row already carries one
    // action, and a phone-width title has no room to spare for a second.
    const upNext = game.status === 'up_next' ? upNextOrdered() : [];
    const queuePos = upNext.findIndex(g => g.id === game.id);
    const isFirst = queuePos <= 0;
    const isLast = queuePos === upNext.length - 1;

    root.innerHTML = `
      <div class="overlay" id="detailOverlay">
        <div class="modal" style="position:relative">
          <button class="close" id="closeDetail" aria-label="Close">&#10005;</button>
          <button class="edit-btn" id="editDetail" aria-label="Edit game">&#9998;</button>
          ${cover}
          <div class="detail-head">
            <h2 class="display">${escapeHtml(game.title)}</h2>
            <div class="detail-year">${game.year ? game.year + ' · ' : ''}${STATUS_LABEL[game.status]} · added by ${escapeHtml(game.addedBy || 'someone')}</div>
          </div>

          <div class="chips" id="detailChips">
            ${tagEl(game.platform)}
          </div>

          <div id="detailInfo">
            ${game.sourceId
              ? '<div class="status-msg" style="padding:8px 0">Looking it up…</div>'
              : '<div class="detail-desc" style="font-size:14px">Added by hand, so there is no database entry to pull details from.</div>'}
          </div>

          <div>
            <div class="detail-label" style="margin-bottom:7px">Note for the group</div>
            <textarea id="noteInput" rows="2" placeholder="e.g. 4-player co-op, needs Game Pass">${escapeHtml(game.note || '')}</textarea>
            <button class="btn secondary" id="saveNoteBtn" style="margin-top:9px;width:100%">Save note</button>
          </div>

          ${upNext.length > 1 ? `
          <div class="detail-actions">
            ${!isFirst ? '<button class="btn secondary" id="moveUpBtn">&#9650; Play sooner</button>' : ''}
            ${!isLast ? '<button class="btn secondary" id="moveDownBtn">&#9660; Play later</button>' : ''}
          </div>` : ''}

          <div class="detail-actions">
            ${canRevert ? '<button class="btn secondary" id="detailBack">Move back</button>' : ''}
            ${canAdvance ? '<button class="btn" id="detailFwd">' + (game.status === 'up_next' ? 'Put on stage' : 'Mark played') + '</button>' : ''}
          </div>
          <button class="btn secondary" id="detailDelete" style="color:var(--spot);border-color:rgba(255,60,172,0.5)">Delete this game</button>
        </div>
      </div>
    `;

    const close = () => { root.innerHTML = ''; };
    $('#closeDetail').onclick = close;
    $('#detailOverlay').addEventListener('click', e => { if (e.target.id === 'detailOverlay') close(); });

    $('#saveNoteBtn').onclick = async () => {
      const btn = $('#saveNoteBtn');
      btn.textContent = 'Saving…';
      try{
        await saveNote(game, $('#noteInput').value.trim());
        btn.textContent = 'Saved';
      }catch(e){
        btn.textContent = 'Could not save — try again';
      }
    };

    if ($('#detailFwd')) $('#detailFwd').onclick = () => { close(); advanceStatus(game); };
    if ($('#detailBack')) $('#detailBack').onclick = () => { close(); revertStatus(game); };
    if ($('#moveUpBtn')) $('#moveUpBtn').onclick = () => { close(); moveInQueue(game, -1); };
    if ($('#moveDownBtn')) $('#moveDownBtn').onclick = () => { close(); moveInQueue(game, 1); };
    $('#detailDelete').onclick = () => { close(); openDeleteModal(game); };
    $('#editDetail').onclick = () => { close(); openEditModal(game); };

    if (game.sourceId) loadDetailInto(game);
  }

  /**
   * The sheet opens on what we already know and fills in the rest when it
   * arrives, so a slow or unreachable RAWG never holds up the group's own data.
   */
  async function loadDetailInto(game){
    const infoEl = $('#detailInfo');
    const chipsEl = $('#detailChips');
    if (!infoEl) return;
    try{
      const d = await fetchGameDetail(game.sourceId);
      if (!$('#detailInfo')) return;   // closed while we were waiting

      const facts = [];
      if (d.metacritic) facts.push('<span class="chip strong">' + d.metacritic + ' on Metacritic</span>');
      if (d.playtime) facts.push('<span class="chip">~' + d.playtime + 'h to finish</span>');
      if (chipsEl && facts.length) chipsEl.insertAdjacentHTML('beforeend', facts.join(''));

      const parts = [];
      if (d.platforms.length){
        parts.push('<div><div class="detail-label" style="margin-bottom:7px">Playable on</div>'
          + '<div class="chips">' + d.platforms.map(n => '<span class="chip">' + escapeHtml(n) + '</span>').join('') + '</div></div>');
      }
      if (d.genres.length){
        parts.push('<div><div class="detail-label" style="margin-bottom:7px">Genres</div>'
          + '<div class="chips">' + d.genres.map(n => '<span class="chip">' + escapeHtml(n) + '</span>').join('') + '</div></div>');
      }
      if (d.description){
        parts.push('<div><div class="detail-label" style="margin-bottom:7px">About</div>'
          + '<div class="detail-desc">' + escapeHtml(d.description) + '</div></div>');
      }
      infoEl.innerHTML = parts.length
        ? '<div style="display:flex;flex-direction:column;gap:14px">' + parts.join('') + '</div>'
        : '';
    }catch(e){
      if ($('#detailInfo')) infoEl.innerHTML = '<div class="banner">Could not reach the game database, so there is nothing extra to show right now.</div>';
    }
  }

  /**
   * The only fields on offer are title and platform — the two things someone
   * actually gets wrong (a typo, or picking the console they meant to play it
   * on). Cover, year and sourceId come from RAWG at add time; if those are
   * wrong the game itself was probably picked wrong, and re-adding it from
   * search is the more honest fix than hand-editing metadata out of sync with
   * where it came from.
   */
  function openEditModal(game){
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="overlay" id="editOverlay">
        <div class="modal" style="position:relative">
          <button class="close" id="closeEdit" aria-label="Close">&#10005;</button>
          <h2 class="display">EDIT GAME</h2>
          <div class="field">
            <label for="editTitle">Title</label>
            <input id="editTitle" type="text" value="${escapeHtml(game.title)}">
          </div>
          <div class="field">
            <label for="editPlatform">Platform</label>
            <select id="editPlatform">
              ${PLATFORMS.map(p => `<option ${p === game.platform ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <button class="btn" id="saveEditBtn" style="width:100%">Save changes</button>
        </div>
      </div>
    `;

    const close = () => { root.innerHTML = ''; };
    $('#closeEdit').onclick = close;
    $('#editOverlay').addEventListener('click', e => { if (e.target.id === 'editOverlay') close(); });

    $('#saveEditBtn').onclick = async () => {
      const title = $('#editTitle').value.trim();
      if (!title) return;
      const btn = $('#saveEditBtn');
      btn.textContent = 'Saving…';
      game.title = title;
      game.platform = $('#editPlatform').value;
      game.updatedAt = Date.now();
      game.updatedBy = state.myName;
      render();
      try{
        await saveGame(game);
        close();
      }catch(e){
        btn.textContent = 'Could not save — try again';
      }
    };
    $('#editTitle').addEventListener('keydown', e => { if (e.key === 'Enter') $('#saveEditBtn').click(); });
    $('#editTitle').focus();
  }

  function openDeleteModal(game){
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="overlay" id="deleteOverlay">
        <div class="modal" style="position:relative">
          <h2 class="display">GAME OVER?</h2>
          <p style="margin:0;font-size:15px;font-weight:500;color:var(--ink-dim)">
            <strong style="color:var(--ink)">${escapeHtml(game.title)}</strong>
            will be removed for everyone. This cannot be undone.
          </p>
          <div style="display:flex;gap:10px;margin-top:4px">
            <button class="btn secondary" id="cancelDeleteBtn" style="flex:1">Keep it</button>
            <button class="btn" id="confirmDeleteBtn" style="flex:1">Delete</button>
          </div>
        </div>
      </div>
    `;
    const close = () => { root.innerHTML = ''; };
    $('#cancelDeleteBtn').onclick = close;
    $('#deleteOverlay').addEventListener('click', e => { if (e.target.id === 'deleteOverlay') close(); });
    $('#confirmDeleteBtn').onclick = () => { close(); removeGame(game); };
  }

  function openPassModal(message){
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="overlay" id="passOverlay">
        <div class="modal" style="position:relative">
          <h2 class="display">INSERT COIN</h2>
          ${message ? `<p style="margin:0;font-size:15px;font-weight:600;color:var(--spot)">${escapeHtml(message)}</p>` : ''}
          <p style="margin:0;font-size:15px;font-weight:500;color:var(--ink-dim)">The set list is private. Enter the pass code the group shares, and the name your friends will see.</p>
          <div class="field">
            <label for="passInput">Pass code</label>
            <input id="passInput" type="text" autocomplete="off" spellcheck="false" placeholder="Paste the code">
          </div>
          <div class="field">
            <label for="passNameInput">Your name</label>
            <input id="passNameInput" type="text" maxlength="24" placeholder="e.g. Sam" value="${escapeHtml(state.myName||'')}">
          </div>
          <button class="btn" id="enterBtn">Let me in</button>
        </div>
      </div>
    `;

    const submit = async () => {
      const code = $('#passInput').value.trim();
      const name = $('#passNameInput').value.trim();
      if (!code || !name) return;
      saveName(name);
      saveToken(code);
      state.needsPass = false;
      $('#modalRoot').innerHTML = '';
      // A wrong code 401s inside loadGames, which reopens this with an error.
      try{ await loadGames(); startPolling(); }catch(e){ /* handled by apiFetch */ }
    };

    $('#enterBtn').onclick = submit;
    $('#passInput').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    $('#passNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    $('#passInput').focus();
  }

  function openNameModal(){
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="overlay" id="nameOverlay">
        <div class="modal" style="position:relative">
          <h2 class="display">CHANGE YOUR NAME</h2>
          <p style="margin:0;font-size:15px;font-weight:500;color:var(--ink-dim)">Pick the name your friends will see next to games you add or move.</p>
          <div class="field">
            <label for="nameInput">Your name</label>
            <input id="nameInput" type="text" maxlength="24" placeholder="e.g. Sam" value="${escapeHtml(state.myName||'')}">
          </div>
          <button class="btn" id="saveNameBtn">Get pass</button>
        </div>
      </div>
    `;
    const input = $('#nameInput');
    input.focus();
    $('#saveNameBtn').onclick = async () => {
      const val = input.value.trim();
      if (!val) return;
      await saveName(val);
      root.innerHTML = '';
      render();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') $('#saveNameBtn').click(); });
  }

  // ===== Add-game modal =====
  function openAddModal(){
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="overlay" id="addOverlay">
        <div class="modal" style="position:relative">
          <button class="close" id="closeAdd" aria-label="Close">×</button>
          <h2 class="display">ADD A GAME</h2>
          <div class="field">
            <label for="igdbSearch">Search for a game</label>
            <input id="igdbSearch" type="text" placeholder="Start typing a title…" autocomplete="off">
          </div>
          <div id="searchStatus"></div>
          <div id="searchResults"></div>
          <div style="border-top:1px solid var(--line);padding-top:14px;margin-top:2px">
            <p class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-dim);margin:0 0 10px">Can't find it? Add manually</p>
            <div class="field" style="margin-bottom:10px">
              <label for="manualTitle">Title</label>
              <input id="manualTitle" type="text" placeholder="Game title">
            </div>
            <div class="field" style="margin-bottom:10px">
              <label for="manualPlatform">Platform</label>
              <select id="manualPlatform">
                ${PLATFORMS.map(p => `<option>${p}</option>`).join('')}
              </select>
            </div>
            <button class="btn secondary" id="manualAddBtn" style="width:100%">Add to On Deck</button>
          </div>
        </div>
      </div>
    `;
    $('#closeAdd').onclick = () => { root.innerHTML = ''; };
    $('#addOverlay').addEventListener('click', e => { if (e.target.id === 'addOverlay') root.innerHTML = ''; });

    $('#manualAddBtn').onclick = async () => {
      const title = $('#manualTitle').value.trim();
      const platform = $('#manualPlatform').value;
      if (!title) return;
      await addGame({ title, platform });
      root.innerHTML = '';
    };

    let debounceTimer = null;
    $('#igdbSearch').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const q = e.target.value.trim();
      if (!q){ $('#searchResults').innerHTML = ''; $('#searchStatus').innerHTML = ''; return; }
      debounceTimer = setTimeout(() => runIgdbSearch(q), 350);
    });
  }

  async function runIgdbSearch(query){
    const statusEl = $('#searchStatus');
    const resultsEl = $('#searchResults');
    if (!RAWG_API_KEY || RAWG_API_KEY === 'REPLACE_WITH_YOUR_RAWG_API_KEY'){
      statusEl.innerHTML = `<div class="banner">Game lookup isn't connected yet — add the game manually below for now.</div>`;
      resultsEl.innerHTML = '';
      return;
    }
    statusEl.innerHTML = `<div class="status-msg" style="padding:8px 0">Searching…</div>`;
    resultsEl.innerHTML = '';
    try{
      const url = 'https://api.rawg.io/api/games?key=' + encodeURIComponent(RAWG_API_KEY)
        + '&search=' + encodeURIComponent(query) + '&page_size=10';
      const res = await fetch(url);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      const results = (data.results || []).map(g => ({
        sourceId: g.id,
        title: g.name,
        coverUrl: g.background_image || null,
        platforms: mapRawgPlatforms(g.platforms),
        year: g.released ? new Date(g.released).getFullYear() : null,
      }));
      statusEl.innerHTML = '';
      if (results.length === 0){
        resultsEl.innerHTML = `<div class="empty">No matches. Try a different search or add it manually below.</div>`;
        return;
      }
      resultsEl.innerHTML = results.map((r, i) => `
        <div class="result-row" data-idx="${i}">
          ${r.coverUrl ? `<div class="cover"><img src="${r.coverUrl}" alt=""></div>` : `<div class="cover">${(r.title||'?')[0]}</div>`}
          <div>
            <div class="rtitle">${escapeHtml(r.title)}${r.year ? ' <span style="color:var(--ink-dim)">('+r.year+')</span>' : ''}</div>
            <div class="rmeta">${(r.platforms||[]).join(' · ')}</div>
          </div>
        </div>
      `).join('');
      $$('.result-row', resultsEl).forEach(row => {
        row.onclick = async () => {
          const r = results[Number(row.dataset.idx)];
          if (!r) return;
          await addGame({
            title: r.title,
            platform: (r.platforms && r.platforms[0]) || 'Other',
            coverUrl: r.coverUrl,
            sourceId: r.sourceId,
            year: r.year,
          });
          $('#modalRoot').innerHTML = '';
        };
      });
    }catch(e){
      statusEl.innerHTML = `<div class="banner error">Couldn't reach the game database. Add it manually below instead.</div>`;
    }
  }

  // ===== Init =====
  function wireStatic(){
    $$('.tab').forEach(tab => {
      tab.onclick = () => { state.activeTab = tab.dataset.status; render(); };
    });
    $$('.pf-chip').forEach(chip => {
      chip.onclick = () => { state.platformFilter = chip.dataset.platform; render(); };
    });
    $('#searchInput').addEventListener('input', e => { state.query = e.target.value; render(); });
    $('#addBtn').onclick = () => {
      if (!state.myName){ openNameModal(); return; }
      openAddModal();
    };
  }

  async function init(){
    wireStatic();
    loadName();
    render();

    if (!loadToken()){
      state.needsPass = true;
      state.loading = false;
      render();
      openPassModal();
      return;
    }
    if (!state.myName){ openNameModal(); }

    try{ await loadGames(); }catch(e){ return; }
    startPolling();
  }

  init();
})();
</script>

</body>
</html>
